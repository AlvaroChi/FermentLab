[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = platformio/espressif32
board = esp32dev
framework = arduino

lib_deps =
    pololu/VL53L0X @ 1.3.1
    bblanchon/ArduinoJson @ 7.4.2
    paulstoffregen/OneWire @ 2.3.8
    milesburton/DallasTemperature @ 3.11.0

monitor_speed = 115200
monitor_eol = LF
monitor_port = COM3
upload_port = COM3

build_flags =
    -Wall
    -Wextra
