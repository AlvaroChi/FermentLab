[platformio]
default_envs = esp32s3zero

[env:esp32s3zero]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
board_upload.flash_size = 4MB
build_flags =
    -Wall
    -Wextra
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    bblanchon/ArduinoJson @ 7.4.2
monitor_speed = 115200
monitor_eol = LF
